    { id: 2, q: "2. পিয়াজের মতে, ‘reversibility’ বলতে কী বোঝায়?", options: { A: "একই কাজ বারবার করা", B: "একটি মানসিক প্রক্রিয়াকে বিপরীতভাবে চিন্তা করার ক্ষমতা", C: "কোনো বিষয় মুখস্থ করার ক্ষমতা", D: "অন্যকে অনুকরণ করার ক্ষমতা" }, ans: "B" },
    { id: 3, q: "3. একজন শিশু বুঝতে পারে যে 5 + 3 = 8 এবং 8 - 3 = 5। এটি কোন cognitive ability-এর উদাহরণ?", options: { A: "Egocentrism", B: "Reversibility", C: "Animism", D: "Centration" }, ans: "B" },
    { id: 4, q: "4. Vygotsky-এর মতে, private speech শিশুর জন্য কী ভূমিকা পালন করতে পারে?", options: { A: "এটি সবসময় শেখার বাধা সৃষ্টি করে", B: "এটি self-regulation ও চিন্তন নিয়ন্ত্রণে সাহায্য করতে পারে", C: "এটি শুধুমাত্র ভাষাগত ভুলের লক্ষণ", D: "এটি সামাজিক বিকাশকে বাধা দেয়" }, ans: "B" },
    { id: 5, q: "5. একজন শিক্ষক কোনো শিক্ষার্থীকে সরাসরি উত্তর না দিয়ে এমন প্রশ্ন করেন যা তাকে নিজে উত্তর আবিষ্কার করতে সাহায্য করে। এটি কোন শিক্ষণনীতির সঙ্গে বেশি সামঞ্জস্যপূর্ণ?", options: { A: "Guided discovery", B: "Rote learning", C: "Punitive learning", D: "Passive learning" }, ans: "A" },
    { id: 6, q: "6. একটি শিশু কোনো সমস্যার সমাধান করার সময় প্রথমে ভুল পদ্ধতি ব্যবহার করলেও পরে নিজের ভুল বিশ্লেষণ করে সঠিক পদ্ধতি নির্বাচন করে। এটি কোন ধরনের learning-এর উদাহরণ?", options: { A: "Meaningful learning", B: "Mechanical learning", C: "Incidental learning", D: "Passive learning" }, ans: "A" },
    { id: 7, q: "7. একজন শিক্ষার্থী বলে, “আমি এই অঙ্কটি পারব না, কারণ আমি গণিতে জন্ম থেকেই দুর্বল।” এই বক্তব্যে কোন ধরনের attribution দেখা যাচ্ছে?", options: { A: "Internal and controllable", B: "Internal and uncontrollable", C: "External and controllable", D: "External and temporary" }, ans: "B" },
    { id: 8, q: "8. একজন শিক্ষক বলেন, “তোমার উত্তরটি ভুল, কিন্তু তুমি যে পদ্ধতিটি ব্যবহার করেছ সেটি নিয়ে আমরা আরও একবার চিন্তা করতে পারি।” এই feedback-এর প্রধান বৈশিষ্ট্য কী?", options: { A: "ব্যক্তি-কেন্দ্রিক সমালোচনা", B: "Learning-oriented feedback", C: "Punitive feedback", D: "Comparative feedback" }, ans: "B" },
    { id: 9, q: "9. শিক্ষার্থীদের মধ্যে achievement motivation বৃদ্ধির জন্য কোন কাজটি সবচেয়ে উপযুক্ত?", options: { A: "সব শিক্ষার্থীকে একই কঠিন task দেওয়া", B: "বাস্তবসম্মত ও challenging goal নির্ধারণের সুযোগ দেওয়া", C: "শুধু সর্বোচ্চ নম্বরপ্রাপ্তদের প্রশংসা করা", D: "ব্যর্থতার জন্য শাস্তি দেওয়া" }, ans: "B" },
    { id: 10, q: "10. একজন শিক্ষার্থী মনে করে যে ভালো ফল করার জন্য তার নিজের প্রচেষ্টা গুরুত্বপূর্ণ। এই বিশ্বাসটি কোন ধারণার সঙ্গে সম্পর্কিত?", options: { A: "Self-efficacy", B: "External locus of control", C: "Learned helplessness", D: "Fixed intelligence" }, ans: "A" },
    { id: 11, q: "11. ‘Fixed mindset’ ধারণার সঙ্গে কোন বক্তব্যটি সবচেয়ে বেশি সামঞ্জস্যপূর্ণ?", options: { A: "প্রচেষ্টার মাধ্যমে ক্ষমতা উন্নত করা যায়", B: "ভুল শেখার একটি অংশ", C: "বুদ্ধিমত্তা মূলত স্থির এবং পরিবর্তন করা কঠিন", D: "চ্যালেঞ্জ গ্রহণ করলে দক্ষতা বাড়ে" }, ans: "C" },
    { id: 12, q: "12. একজন শিক্ষক শিক্ষার্থীদের বলেন, “তোমাদের প্রথম উত্তরটি চূড়ান্ত নয়; প্রমাণ পাওয়ার পর উত্তর পরিবর্তন করতে পারো।” এটি কোন বৈশিষ্ট্যকে উৎসাহিত করে?", options: { A: "Cognitive flexibility", B: "Rote memorisation", C: "Conformity", D: "Passive learning" }, ans: "A" },
    { id: 13, q: "13. একটি শিশুকে কোনো বিষয়ের বিভিন্ন দিক নিয়ে আলোচনা করতে বলা হলে তার critical thinking বিকাশের জন্য কোনটি সবচেয়ে গুরুত্বপূর্ণ?", options: { A: "শুধুমাত্র সঠিক উত্তর বলা", B: "প্রমাণ ও যুক্তির ভিত্তিতে মতামত তৈরি করা", C: "পাঠ্যবইয়ের বাক্য হুবহু বলা", D: "দ্রুত উত্তর দেওয়া" }, ans: "B" },
    { id: 14, q: "14. একজন শিক্ষক শিক্ষার্থীদের একটি প্রকল্পের মূল্যায়নের জন্য নির্দিষ্ট criteria আগে থেকেই জানিয়ে দেন। এর ফলে কী সুবিধা হয়?", options: { A: "Assessment আরও transparent হয়", B: "Assessment-এর প্রয়োজন শেষ হয়", C: "শিক্ষার্থীরা শুধু মুখস্থ করে", D: "শিক্ষককে কোনো feedback দিতে হয় না" }, ans: "A" },
    { id: 15, q: "15. Rubric-এর প্রধান উদ্দেশ্য কী?", options: { A: "শিক্ষার্থীদের randomভাবে নম্বর দেওয়া", B: "নির্দিষ্ট criteria অনুযায়ী performance মূল্যায়ন করা", C: "শুধুমাত্র উপস্থিতি যাচাই করা", D: "শিক্ষার্থীদের বয়স নির্ধারণ করা" }, ans: "B" },
    { id: 16, q: "16. একজন শিক্ষক লক্ষ্য করেন যে কোনো শিক্ষার্থী মৌখিক নির্দেশ অনুসরণ করতে সমস্যায় পড়ে, কিন্তু লিখিত নির্দেশ ভালোভাবে অনুসরণ করে। শিক্ষক কী করবেন?", options: { A: "শিক্ষার্থীকে অক্ষম ঘোষণা করবেন", B: "শেখানোর পদ্ধতিতে উপযুক্ত পরিবর্তন করবেন", C: "তাকে কোনো নির্দেশ দেবেন না", D: "তাকে মূল্যায়ন থেকে বাদ দেবেন" }, ans: "B" },
    { id: 17, q: "17. শিক্ষার্থীদের ভুল ধারণা বা misconception শনাক্ত করার জন্য কোন ধরনের প্রশ্ন বেশি কার্যকর?", options: { A: "শুধুমাত্র Yes/No প্রশ্ন", B: "“তুমি কেন এমন মনে কর?” ধরনের probing question", C: "শুধুমাত্র factual question", D: "শুধুমাত্র memory-based question" }, ans: "B" },
    { id: 18, q: "18. একজন শিক্ষক শিক্ষার্থীদের আগে নিজের উত্তর তৈরি করতে বলেন, তারপর জোড়ায় আলোচনা করতে এবং শেষে শ্রেণিতে আলোচনা করতে বলেন। এই strategy-টি কী নামে পরিচিত?", options: { A: "Think-Pair-Share", B: "Drill and Practice", C: "Lecture Method", D: "Programmed Instruction" }, ans: "A" },
    { id: 19, q: "19. শিক্ষার্থীদের কোনো ধারণা সম্পর্কে আগে কী জানে তা লিখতে দিয়ে পরে পাঠ শেষে কী নতুন শিখেছে তা লিখতে বলা হলে প্রধানত কী মূল্যায়ন করা যায়?", options: { A: "Learning progression", B: "Physical development", C: "Motor ability", D: "Intelligence quotient" }, ans: "A" },

  let timeInSeconds = 40 * 60; // 40 minutes timer
  let timerInterval;

  function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    questions.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `q-card-${item.id}`;

      let optionsHtml = '';
      for (const [key, val] of Object.entries(item.options)) {
        optionsHtml += `
          <li>
            <label id="lbl-${item.id}-${key}">
              <input type="radio" name="q${item.id}" value="${key}">
              ${key}. ${val}
            </label>
          </li>
        `;
      }

      card.innerHTML = `
        <div class="question-title">${item.q}</div>
        <ul class="options-list">${optionsHtml}</ul>
      `;
      container.appendChild(card);
    });
  }

  function startTest() {
    const name = document.getElementById('student-name').value.trim();
    const phone = document.getElementById('student-phone').value.trim();

    if (!name || !phone) {
      alert("Please enter both your Full Name and Mobile Number to start.");
      return;
    }

    document.getElementById('registration-section').style.display = 'none';
    document.getElementById('test-section').style.display = 'block';

    renderQuestions();
    startTimer();
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      timeInSeconds--;
      let minutes = Math.floor(timeInSeconds / 60);
      let seconds = timeInSeconds % 60;

      document.getElementById('time-display').innerText = 
        `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

      if (timeInSeconds <= 0) {
        clearInterval(timerInterval);
        alert("Time is up! Your test will be submitted automatically.");
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    clearInterval(timerInterval);

    let score = 0;
    const form = document.getElementById('quiz-form');
    const formData = new FormData(form);

    questions.forEach(item => {
      const userAns = formData.get(`q${item.id}`);
      const correctAns = item.ans;

      // Disable inputs post-submission
      const radios = document.getElementsByName(`q${item.id}`);
      radios.forEach(r => r.disabled = true);

      // Scoring: +1 for correct, 0 for wrong
      if (userAns === correctAns) {
        score++;
      }

      // Preview highlight: Correct = Green, Wrong attempt = Red
      if (userAns) {
        if (userAns === correctAns) {
          document.getElementById(`lbl-${item.id}-${userAns}`).classList.add('opt-correct');
        } else {
          document.getElementById(`lbl-${item.id}-${userAns}`).classList.add('opt-wrong');
          document.getElementById(`lbl-${item.id}-${correctAns}`).classList.add('opt-correct');
        }
      } else {
        // Highlight correct answer in green if question was unattempted
        document.getElementById(`lbl-${item.id}-${correctAns}`).classList.add('opt-correct');
      }
    });

    // Display total result
    document.getElementById('result-box').style.display = 'block';
    document.getElementById('score-text').innerHTML = `Your Score: <strong>${score} / ${questions.length}</strong>`;
    
    // Hide top timer and submit button
    document.getElementById('timer-sticky').style.display = 'none';
    form.querySelector('button[type="button"]').style.display = 'none';

    // Sync score to Google Sheets
    sendToGoogleSheet(score);
  }

  function sendToGoogleSheet(score) {
    if (GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL" || !GOOGLE_SCRIPT_URL) {
      console.warn("Google Apps Script URL is not configured.");
      return;
    }

    const name = document.getElementById('student-name').value;
    const phone = document.getElementById('student-phone').value;

    const payload = {
      name: name,
      phone: phone,
      score: score,
      total: questions.length,
      timestamp: new Date().toLocaleString()
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
    .then(() => console.log("Data successfully posted to Google Sheets."))
    .catch(err => console.error("Error connecting to Google Apps Script:", err));
  }
</script>
